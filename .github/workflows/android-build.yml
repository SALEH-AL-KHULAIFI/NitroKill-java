name: Build NitroKill APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          set -e

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          echo "Android SDK: ${ANDROID_HOME}"
          echo "SDK Manager: ${SDKMANAGER}"

          yes | "${SDKMANAGER}" --licenses >/dev/null || true

          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          ls -la "${ANDROID_HOME}/platforms/android-36"
          ls -la "${ANDROID_HOME}/build-tools/36.0.0"

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Print APK information
        run: |
          set -e

          echo "===== Debug APK ====="
          ls -lh app/build/outputs/apk/debug/*.apk

          echo
          echo "===== Release APK ====="
          ls -lh app/build/outputs/apk/release/*.apk

          echo
          echo "===== APK contents ====="
          unzip -l app/build/outputs/apk/release/*.apk | \
            sort -k1 -n -r | head -n 25

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nitrokill-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: nitrokill-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
